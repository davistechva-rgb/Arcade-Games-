<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Arcade | Davis Tech Support</title>
<meta name="description" content="Nine classic arcade games in your browser: Snake, Blocks, Breakout, Space Rocks, Alien Invasion, and more. Free, offline, no ads.">
<meta name="theme-color" content="#08060F">
<link rel="icon" href="assets/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{--bg:#08060F;--pink:#FF3EA5;--cyan:#2DF6F6;--yel:#FFE53B;--grn:#57FF6B;--ink:#F2EEFF;--dim:#8A80B0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:20px/1.3 "VT323",monospace;overflow:hidden;touch-action:manipulation}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);z-index:50}
.pix{font-family:"Press Start 2P",monospace}
#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom))}
.top{width:100%;max-width:980px;display:flex;align-items:center;gap:10px}
.top img{height:34px}.top .ttl{font-size:14px;color:var(--pink);text-shadow:0 0 8px var(--pink)}
.top .sp{flex:1}
.ib{appearance:none;background:none;border:2px solid var(--dim);color:var(--ink);font:12px "Press Start 2P",monospace;padding:8px 10px;cursor:pointer;border-radius:4px}
.ib:hover{border-color:var(--cyan);color:var(--cyan)}
#menu{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:26px;text-align:center;overflow-y:auto;min-height:0;padding:12px 0 20px;width:100%}
#menu h1{font:clamp(26px,6vw,52px)/1.2 "Press Start 2P",monospace;margin:0;color:var(--yel);text-shadow:0 0 6px var(--yel),4px 4px 0 var(--pink)}
#menu .sub{color:var(--dim);font-size:24px;margin-top:-8px}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,220px));gap:16px}
@media (max-width:720px){.games{grid-template-columns:1fr 1fr;width:min(460px,94vw);gap:12px}.gm{padding:14px 8px}.gm i{font-size:34px}.gm b{font-size:11px}.gm span{font-size:17px}}
.gm{appearance:none;background:rgba(255,255,255,.03);border:3px solid var(--c);color:var(--ink);border-radius:8px;padding:20px 14px;cursor:pointer;box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 14px color-mix(in srgb,var(--c) 25%,transparent);transition:transform .1s}
.gm:hover,.gm:focus-visible{transform:translateY(-3px) scale(1.02);outline:none}
.gm b{display:block;font:15px "Press Start 2P",monospace;color:var(--c);margin:12px 0 8px}.gm span{color:var(--dim);font-size:20px}.gm i{display:block;font-style:normal;font-size:44px;line-height:1}
.gm .hs{margin-top:10px;color:var(--yel);font-size:20px}
#play{flex:1;width:100%;max-width:980px;display:none;flex-direction:column;align-items:center;min-height:0}
.hud{width:100%;display:flex;justify-content:space-between;gap:10px;font:12px "Press Start 2P",monospace;padding:10px 4px;color:var(--cyan)}
.hud b{color:var(--yel);font-weight:400}
.screen{position:relative;flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;border:3px solid var(--c,#2DF6F6);border-radius:6px;box-shadow:0 0 22px color-mix(in srgb,var(--c,#2DF6F6) 40%,transparent);background:#0B0918;touch-action:none}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(8,6,15,.78);text-align:center;padding:20px;z-index:5}
.ov.on{display:flex}.ov h2{font:clamp(18px,4vw,30px) "Press Start 2P",monospace;margin:0;color:var(--yel);text-shadow:0 0 8px var(--yel)}.ov p{margin:0;color:var(--ink);font-size:24px}
.big{appearance:none;background:var(--pink);color:#0B0918;border:0;font:14px "Press Start 2P",monospace;padding:14px 20px;border-radius:6px;cursor:pointer;box-shadow:0 0 16px var(--pink)}
.ctl{display:none;gap:10px;padding:12px 0 0;width:100%;max-width:520px;justify-content:center;flex-wrap:wrap}
.touch .ctl.show{display:flex}
.ctl button{appearance:none;flex:1;min-width:58px;min-height:58px;background:rgba(45,246,246,.08);border:2px solid var(--cyan);color:var(--cyan);font:14px "Press Start 2P",monospace;border-radius:10px;touch-action:none;user-select:none}
.ctl button:active{background:rgba(45,246,246,.3)}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,58px);gap:8px;justify-content:center}
.pad button{min-width:0}.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.help{color:var(--dim);font-size:19px;text-align:center;padding-top:8px}.touch .help{display:none}
footer{color:var(--dim);font-size:18px;text-align:center}footer a{color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <div class="top"><img src="assets/logo-mark-white.png" alt="Davis Tech Support"><span class="ttl pix">ARCADE</span><span class="sp"></span>
  <button class="ib" id="mute" type="button" aria-pressed="false">SOUND ON</button><button class="ib" id="back" type="button" hidden>MENU</button></div>
 <div id="menu">
  <div><h1>ARCADE</h1><div class="sub">pick a game · no ads · works offline</div></div>
  <div class="games">
   <button class="gm" data-g="snake" style="--c:#57FF6B"><i>🐍</i><b>SNAKE</b><span>Eat, grow, don't bite yourself</span><div class="hs" id="hs-snake"></div></button>
   <button class="gm" data-g="blocks" style="--c:#2DF6F6"><i>🧱</i><b>BLOCKS</b><span>Stack them. Clear lines.</span><div class="hs" id="hs-blocks"></div></button>
   <button class="gm" data-g="breakout" style="--c:#FF3EA5"><i>🏓</i><b>BREAKOUT</b><span>Smash every brick</span><div class="hs" id="hs-breakout"></div></button>
   <button class="gm" data-g="rocks" style="--c:#FFE53B"><i>☄️</i><b>SPACE ROCKS</b><span>Blast the asteroids</span><div class="hs" id="hs-rocks"></div></button>
   <button class="gm" data-g="invaders" style="--c:#57FF6B"><i>👾</i><b>ALIEN INVASION</b><span>Hold the line</span><div class="hs" id="hs-invaders"></div></button>
   <button class="gm" data-g="paddle" style="--c:#2DF6F6"><i>🎾</i><b>PADDLE DUEL</b><span>Beat the computer to 7</span><div class="hs" id="hs-paddle"></div></button>
   <button class="gm" data-g="hopper" style="--c:#57FF6B"><i>🐸</i><b>ROAD HOPPER</b><span>Cross the road and river</span><div class="hs" id="hs-hopper"></div></button>
   <button class="gm" data-g="flap" style="--c:#FF9F2D"><i>🐤</i><b>SKY FLAP</b><span>Tap through the gaps</span><div class="hs" id="hs-flap"></div></button>
   <button class="gm" data-g="merge" style="--c:#B86BFF"><i>🔢</i><b>2048</b><span>Slide and merge</span><div class="hs" id="hs-merge"></div></button>
  </div>
  <footer>made by <a href="https://davis-tech-support.com" target="_blank" rel="noopener">Davis Tech Support</a>, Farmville, VA</footer>
 </div>
 <div id="play">
  <div class="hud"><span>SCORE <b id="sc">0</b></span><span id="mid"></span><span>BEST <b id="best">0</b></span></div>
  <div class="screen"><canvas id="cv"></canvas><div class="ov" id="ov"><h2 id="ovh"></h2><p id="ovp"></p><button class="big" id="ovb" type="button">PLAY</button></div></div>
  <div class="ctl" id="c-snake"><div class="pad"><button class="u" data-k="ArrowUp" aria-label="Up">▲</button><button class="l" data-k="ArrowLeft" aria-label="Left">◀</button><button class="d" data-k="ArrowDown" aria-label="Down">▼</button><button class="r" data-k="ArrowRight" aria-label="Right">▶</button></div></div>
  <div class="ctl" id="c-blocks"><button data-k="ArrowLeft" data-rep="1" aria-label="Move left">◀</button><button data-k="ArrowRight" data-rep="1" aria-label="Move right">▶</button><button data-k="ArrowUp" aria-label="Rotate">⟳</button><button data-k="ArrowDown" data-rep="1" aria-label="Soft drop">▼</button><button data-k=" " aria-label="Hard drop">⤓</button><button data-k="c" aria-label="Hold">HOLD</button></div>
  <div class="ctl" id="c-breakout"></div>
  <div class="ctl" id="c-rocks"><button data-k="ArrowLeft" aria-label="Turn left">⟲</button><button data-k="ArrowRight" aria-label="Turn right">⟳</button><button data-k="ArrowUp" aria-label="Thrust">▲</button><button data-k=" " aria-label="Fire">FIRE</button></div>
  <div class="ctl" id="c-invaders"><button data-k="ArrowLeft" aria-label="Left">◀</button><button data-k="ArrowRight" aria-label="Right">▶</button><button data-k=" " aria-label="Fire">FIRE</button></div>
  <div class="ctl" id="c-paddle"></div>
  <div class="ctl" id="c-hopper"><div class="pad"><button class="u" data-k="ArrowUp" aria-label="Up">▲</button><button class="l" data-k="ArrowLeft" aria-label="Left">◀</button><button class="d" data-k="ArrowDown" aria-label="Down">▼</button><button class="r" data-k="ArrowRight" aria-label="Right">▶</button></div></div>
  <div class="ctl" id="c-flap"></div>
  <div class="ctl" id="c-merge"></div>
  <div class="help" id="help"></div>
 </div>
</div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
if(matchMedia("(pointer:coarse)").matches)document.body.classList.add("touch");
/* ---------- sound ---------- */
let AC=null,muted=get("arc.mute",false);
function beep(f=440,d=.06,type="square",vol=.05,slide=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.linearRampToValueAtTime(f+slide,AC.currentTime+d);g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const SFX={eat:()=>beep(660,.07,"square",.05,300),die:()=>beep(220,.4,"sawtooth",.06,-180),move:()=>beep(200,.02,"square",.02),rot:()=>beep(520,.03,"square",.03),drop:()=>beep(140,.08,"triangle",.08),
 line:n=>{[523,659,784,1047].slice(0,n).forEach((f,i)=>setTimeout(()=>beep(f,.09,"square",.05),i*70))},hit:()=>beep(880,.03,"square",.04),wall:()=>beep(330,.03,"square",.03),pow:()=>beep(440,.2,"triangle",.06,600),lvl:()=>[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.1,"square",.05),i*90))};
function setMute(){$("#mute").textContent=muted?"SOUND OFF":"SOUND ON";$("#mute").setAttribute("aria-pressed",muted)}
$("#mute").onclick=()=>{muted=!muted;set("arc.mute",muted);setMute()};setMute();
/* ---------- shell ---------- */
const cv=$("#cv"),ctx=cv.getContext("2d");let G=null,raf=0,last=0,paused=false,over=false,started=false;
const best=g=>get("arc.best."+g,0);
function hsMenu(){Object.keys(GAMES).forEach(g=>{const e=$("#hs-"+g);if(e)e.textContent=best(g)?"BEST "+best(g):""})}
function size(){if(!G)return;const sc=$(".screen"),W=sc.clientWidth-8,H=sc.clientHeight-8;const ar=G.W/G.H;let w=W,h=W/ar;if(h>H){h=H;w=H*ar}
 const dpr=Math.min(2,devicePixelRatio||1);cv.style.width=Math.floor(w)+"px";cv.style.height=Math.floor(h)+"px";cv.width=Math.floor(w*dpr);cv.height=Math.floor(h*dpr);G.scale=cv.width/G.W;draw()}
function draw(){if(!G)return;ctx.setTransform(G.scale,0,0,G.scale,0,0);ctx.clearRect(0,0,G.W,G.H);G.draw(ctx)}
function hud(){$("#sc").textContent=G.score;$("#best").textContent=Math.max(best(G.id),G.score);$("#mid").innerHTML=G.mid?G.mid():""}
function overlay(h,p,btn){$("#ovh").textContent=h;$("#ovp").innerHTML=p||"";$("#ovb").textContent=btn;$("#ov").classList.add("on")}
function hideOv(){$("#ov").classList.remove("on")}
function loop(t){raf=requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;if(!paused&&!over&&started){G.update(dt);hud()}draw()}
function open(id){G=GAMES[id]();G.id=id;$("#menu").style.display="none";$("#play").style.display="flex";$("#back").hidden=false;cv.style.setProperty("--c",G.color);
 $$(".ctl").forEach(c=>c.classList.toggle("show",c.id==="c-"+id));$("#help").textContent=G.help;paused=false;over=false;started=false;G.reset();hud();size();
 overlay(G.name,G.intro,"PLAY");cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(loop)}
function start(){if(over||!started){G.reset();over=false}started=true;paused=false;hideOv();cv.focus&&cv.focus()}
function pause(p){if(!started||over)return;paused=p;if(p)overlay("PAUSED","Press P or tap to keep playing","RESUME");else hideOv()}
function gameOver(extra){over=true;SFX.die();const b=best(G.id),nb=G.score>b;if(nb)set("arc.best."+G.id,G.score);hud();
 overlay(extra||"GAME OVER",`Score ${G.score}${nb&&G.score?"<br><span style='color:#FFE53B'>NEW BEST!</span>":b?"<br>Best "+b:""}`,"PLAY AGAIN")}
function menu(){cancelAnimationFrame(raf);G=null;$("#play").style.display="none";$("#menu").style.display="flex";$("#back").hidden=true;hideOv();hsMenu()}
$("#ovb").onclick=()=>{if(paused)pause(false);else start()};
$("#back").onclick=menu;$$(".gm").forEach(b=>b.onclick=()=>open(b.dataset.g));
addEventListener("resize",size);document.addEventListener("visibilitychange",()=>{if(document.hidden)pause(true)});
const BLOCK=new Set(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "]);
addEventListener("keydown",e=>{if(!G)return;const k=e.key.length===1?e.key.toLowerCase():e.key;
 if(BLOCK.has(e.key))e.preventDefault();
 if(k==="p"||k==="Escape"){if(!over&&started)pause(!paused);return}if(k==="m"){$("#mute").click();return}
 if(!started||over){if(k==="Enter"||k===" "){start();e.preventDefault()}return}if(paused){if(k==="Enter"||k===" ")pause(false);return}
 G.key&&G.key(k,e.repeat)});
addEventListener("keyup",e=>{if(G&&G.keyup)G.keyup(e.key.length===1?e.key.toLowerCase():e.key)});
// on-screen buttons, with auto-repeat where useful
$$(".ctl button").forEach(b=>{let t=0,iv=0;const fire=()=>{if(!G||!started||over||paused)return;G.key(b.dataset.k,false)};
 b.addEventListener("pointerdown",e=>{e.preventDefault();if(!started||over){start();return}if(paused){pause(false);return}fire();if(b.dataset.rep){t=setTimeout(()=>iv=setInterval(fire,60),180)}});
 const stop=()=>{clearTimeout(t);clearInterval(iv);if(G&&G.keyup)G.keyup(b.dataset.k)};b.addEventListener("pointerup",stop);b.addEventListener("pointerleave",stop);b.addEventListener("pointercancel",stop)});
// pointer on canvas
let sw=null;
cv.addEventListener("pointerdown",e=>{if(!G)return;if(!started||over){start();return}if(paused){pause(false);return}const r=cv.getBoundingClientRect();sw={x:e.clientX,y:e.clientY};G.pointer&&G.pointer((e.clientX-r.left)/r.width*G.W,(e.clientY-r.top)/r.height*G.H,"down")});
cv.addEventListener("pointermove",e=>{if(!G||!G.pointer)return;const r=cv.getBoundingClientRect();G.pointer((e.clientX-r.left)/r.width*G.W,(e.clientY-r.top)/r.height*G.H,"move")});
cv.addEventListener("pointerup",e=>{if(!G||!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;if(G.swipe&&Math.max(Math.abs(dx),Math.abs(dy))>24)G.swipe(Math.abs(dx)>Math.abs(dy)?(dx>0?"ArrowRight":"ArrowLeft"):(dy>0?"ArrowDown":"ArrowUp"))});
const rnd=n=>Math.floor(Math.random()*n);
const glow=(c,col,b=10)=>{c.shadowColor=col;c.shadowBlur=b};
/* ================= SNAKE ================= */
function Snake(){const N=20,CS=24;const g={name:"SNAKE",color:"#57FF6B",W:N*CS,H:N*CS,help:"Arrow keys or WASD to steer · P pause · M mute",intro:"Eat the dots. Golden ones are worth more but don't stay long.",score:0};
 let body,dir,queue,food,gold,acc,step,eaten;
 const free=()=>{for(;;){const p={x:rnd(N),y:rnd(N)};if(!body.some(b=>b.x===p.x&&b.y===p.y)&&!(food&&food.x===p.x&&food.y===p.y))return p}};
 g.reset=()=>{body=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};queue=[];food=null;food=free();gold=null;acc=0;step=.13;eaten=0;g.score=0};
 const D={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
 g.key=k=>{const v=D[k];if(!v)return;const lastD=queue.length?queue[queue.length-1]:dir;if(v[0]===-lastD.x&&v[1]===-lastD.y)return;if(v[0]===lastD.x&&v[1]===lastD.y)return;if(queue.length<3)queue.push({x:v[0],y:v[1]})};
 g.swipe=g.key;
 g.mid=()=>`LEN <b>${body.length}</b>`;
 g.update=dt=>{acc+=dt;if(gold){gold.t-=dt;if(gold.t<=0)gold=null}
  while(acc>=step){acc-=step;if(queue.length)dir=queue.shift();const h={x:body[0].x+dir.x,y:body[0].y+dir.y};
   if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.slice(0,-1).some(b=>b.x===h.x&&b.y===h.y)){gameOver();return}
   body.unshift(h);
   if(h.x===food.x&&h.y===food.y){g.score+=10;eaten++;SFX.eat();food=free();step=Math.max(.06,.13-eaten*.0025);if(!gold&&eaten%5===0){gold=free();gold.t=6}}
   else if(gold&&h.x===gold.x&&h.y===gold.y){g.score+=50;SFX.pow();gold=null;body.push({...body[body.length-1]})}
   else body.pop()}};
 g.draw=c=>{c.fillStyle="#0B0918";c.fillRect(0,0,g.W,g.H);c.strokeStyle="rgba(87,255,107,.06)";c.lineWidth=1;for(let i=1;i<N;i++){c.beginPath();c.moveTo(i*CS,0);c.lineTo(i*CS,g.H);c.moveTo(0,i*CS);c.lineTo(g.W,i*CS);c.stroke()}
  glow(c,"#FF3EA5",14);c.fillStyle="#FF3EA5";c.beginPath();c.arc(food.x*CS+CS/2,food.y*CS+CS/2,CS*.32,0,7);c.fill();
  if(gold){glow(c,"#FFE53B",18);c.fillStyle=gold.t<2&&Math.floor(gold.t*6)%2?"#7a6a10":"#FFE53B";c.beginPath();c.arc(gold.x*CS+CS/2,gold.y*CS+CS/2,CS*.4,0,7);c.fill()}
  glow(c,"#57FF6B",10);body.forEach((b,i)=>{c.fillStyle=i===0?"#B8FFC1":`hsl(128 100% ${62-Math.min(30,i*1.2)}%)`;c.fillRect(b.x*CS+2,b.y*CS+2,CS-4,CS-4)});
  c.shadowBlur=0;const h=body[0];c.fillStyle="#0B0918";const ex=dir.x?0:6,ey=dir.y?0:6;c.fillRect(h.x*CS+CS/2-2+dir.x*5-ex,h.y*CS+CS/2-2+dir.y*5-ey,4,4);c.fillRect(h.x*CS+CS/2-2+dir.x*5+ex,h.y*CS+CS/2-2+dir.y*5+ey,4,4)};
 return g}
/* ================= BLOCKS ================= */
function Blocks(){const C=10,R=20,CS=26,SIDE=6*CS;const g={name:"BLOCKS",color:"#2DF6F6",W:C*CS+SIDE*2,H:R*CS,help:"←→ move · ↑/X rotate · Z rotate back · ↓ soft drop · Space hard drop · C hold · P pause",intro:"Fill a whole row to clear it. Clear 4 at once for a big bonus.",score:0};
 const P={I:[[0,1],[1,1],[2,1],[3,1]],O:[[1,0],[2,0],[1,1],[2,1]],T:[[1,0],[0,1],[1,1],[2,1]],S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]]};
 const COL={I:"#2DF6F6",O:"#FFE53B",T:"#B86BFF",S:"#57FF6B",Z:"#FF4D6D",J:"#4D7CFF",L:"#FF9F2D"};
 let grid,bag,cur,next,hold,canHold,acc,lines,level,lockT,clearing,soft;
 const newBag=()=>{const b=Object.keys(P);for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]]}return b};

   c.fillStyle="#0B0918";const d=String(v).length;c.font=`${d<3?30:d<4?24:18}px 'Press Start 2P'`;c.textAlign="center";c.textBaseline="middle";c.fillText(v,px+CS/2,py+CS/2+2)}
  c.textAlign="left";c.textBaseline="alphabetic"};
 return g}
